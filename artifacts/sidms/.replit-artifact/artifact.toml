kind = "web"
previewPath = "/"
title = "SIDMS – FIB Special Investigation Division"
version = "1.0.0"
id = "artifacts/sidms"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19424

[services.development]
run = "pnpm --filter @workspace/sidms run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sidms", "run", "build" ]
publicDir = "artifacts/sidms/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19424"
BASE_PATH = "/"
